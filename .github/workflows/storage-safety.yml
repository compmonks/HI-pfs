name: Storage safety

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_storage_safety.py'
      - '.github/workflows/storage-safety.yml'

permissions:
  contents: read

jobs:
  storage-safety:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (no execution)
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Isolated storage guard regressions
        run: python3 -m unittest discover -s tests -p 'test_storage_safety.py' -v
